name: Validate and package Torch 255
on:
  push:
    branches: [main, 'codex/**']
    tags: ['v*']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Validate scripts and compatibility behavior
        run: |
          set -euo pipefail
          for f in *.sh lib/*.sh; do sh -n "$f"; done
          python3 -m unittest discover -s tests -v
          mkdir -p .test-build/core-tests
          javac -source 8 -target 8 -d .test-build/core-tests src/TorchProbeCore.java tests/TorchProbeCoreTest.java
          java -ea -cp .test-build/core-tests TorchProbeCoreTest
      - name: Set up Android SDK tools
        uses: android-actions/setup-android@v4
      - name: Build Android ARM64 governor from source
        run: |
          set -euo pipefail
          NDK="$ANDROID_HOME/ndk/27.0.12077973"
          if [ ! -d "$NDK" ]; then sdkmanager 'ndk;27.0.12077973'; fi
          "$NDK/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android26-clang" \
            -Wall -Wextra -Werror -O2 -fPIE -pie src/thermal_governor.c -llog -o bin/thermal_governor
          file bin/thermal_governor
      - name: Build installer Camera API probe
        run: |
          set -euo pipefail
          PLATFORM="$ANDROID_HOME/platforms/android-36/android.jar"
          D8="$ANDROID_HOME/build-tools/36.0.0/d8"
          if [ ! -f "$PLATFORM" ] || [ ! -x "$D8" ]; then
            sdkmanager 'platforms;android-36' 'build-tools;36.0.0'
          fi
          mkdir -p .test-build/probe-classes .test-build/probe-dex
          javac -source 8 -target 8 -classpath "$PLATFORM" -d .test-build/probe-classes src/TorchProbeCore.java src/TorchProbe.java
          "$D8" --min-api 26 --lib "$PLATFORM" --output .test-build/probe-dex .test-build/probe-classes/*.class
          cp .test-build/probe-dex/classes.dex bin/torch_probe.dex
          test -s bin/torch_probe.dex
      - name: Package ZIP
        run: |
          set -euo pipefail
          VERSION="$(awk -F= '$1=="version" {print $2}' module.prop)"
          PACKAGE="HyperOS-Torch-255-v${VERSION}.zip"
          chmod 0755 *.sh bin/thermal_governor
          zip -q -9 -r "$PACKAGE" module.prop customize.sh post-fs-data.sh service.sh \
            uninstall.sh action.sh probe.sh native-probe.sh lib sepolicy.rule bin/thermal_governor bin/torch_probe.dex
          unzip -t "$PACKAGE"
          sha256sum "$PACKAGE" > "$PACKAGE.sha256"
      - uses: actions/upload-artifact@v4
        with:
          name: torch-255-capability
          path: |
            HyperOS-Torch-255-*.zip
            HyperOS-Torch-255-*.zip.sha256
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: torch-255-capability
      - name: Publish tagged release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          RELEASE_ARGS=()
          if [[ "$RELEASE_TAG" == *-* ]]; then
            RELEASE_ARGS+=(--prerelease)
          else
            RELEASE_ARGS+=(--latest)
          fi
          NOTES="release-notes/$RELEASE_TAG.md"
          if [[ -f "$NOTES" ]]; then
            RELEASE_ARGS+=(--notes-file "$NOTES")
          else
            RELEASE_ARGS+=(--generate-notes)
          fi
          gh release create "$RELEASE_TAG" HyperOS-Torch-255-*.zip HyperOS-Torch-255-*.sha256 \
            --target "$GITHUB_SHA" --title "HyperOS Torch 255 $RELEASE_TAG" "${RELEASE_ARGS[@]}"
